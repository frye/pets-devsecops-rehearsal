name: Author-only platform validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  helper-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: rehearsal-source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: github-samples/pets-workshop
          ref: d2437a6f3dbb1fe4bd5e97790ccc12c42cbfc03a
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Extract kit like the learner fetch route
        shell: bash
        run: |
          git -C rehearsal-source archive --format=tar --output="$RUNNER_TEMP/author-kit.tar" HEAD author-kit
          tar -xf "$RUNNER_TEMP/author-kit.tar"
      - name: Exercise helper and independent-history fetch route
        shell: bash
        env:
          PETS_SOURCE_REPO: ${{ github.workspace }}/baseline
        run: |
          python -m unittest discover -s author-kit/tests -p test_helper.py -v
          python -m unittest discover -s author-kit/tests -p test_fetch.py -v
